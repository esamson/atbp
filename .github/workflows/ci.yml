name: Continuous Integration

on:
  pull_request:
    branches: ['**']
  push:
    branches: ['**']
    tags: [v*]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SBT_OPTS: '-Xmx12G'

jobs:
  build:
    name: Build and Test
    strategy:
      matrix:
        os: [ubuntu-latest]
        scala: [3.9.0]
        java: [temurin@25]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java (temurin@25)
        if: matrix.java == 'temurin@25'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Check that workflows are up to date
        run: sbt '++ ${{ matrix.scala }}; githubWorkflowCheck'

      - name: Build project
        run: sbt '++ ${{ matrix.scala }}; test'

      - name: Compress target directories
        run: tar chf targets.tar plate/target stmt2csv/target liga-js/target liga/target target liga-common/.jvm/target traceviz/target jira/target hubad/target confluence/target md2c/target retext/target liga-common/.js/target cli/target stmt2csv-it/target http/target adf-builder/target project/target

      - name: Upload target directories
        uses: actions/upload-artifact@v7
        with:
          name: target-${{ matrix.os }}-${{ matrix.scala }}-${{ matrix.java }}
          path: targets.tar

  publish:
    name: Publish Artifacts
    needs: [build]
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    strategy:
      matrix:
        os: [ubuntu-latest]
        scala: [3.9.0]
        java: [temurin@25]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java (temurin@25)
        if: matrix.java == 'temurin@25'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Download target directories (3.9.0)
        uses: actions/download-artifact@v8
        with:
          name: target-${{ matrix.os }}-3.9.0-${{ matrix.java }}

      - name: Inflate target directories (3.9.0)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Publish jars
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        run: sbt ci-release

      - name: Publish container
        run: sbt dockerPublish

      - name: Package universal zip
        if: startsWith(github.ref, 'refs/tags/v')
        run: sbt cli/Universal/packageBin

      - name: Upload universal zip
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: atbp
          path: cli/target/universal/*.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        os: [ubuntu-latest]
        scala: [3.9.0]
        java: [temurin@25]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Download universal zip
        uses: actions/download-artifact@v8
        with:
          name: atbp
          path: dist

      - name: Create or update GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(dist/*.zip)
          if (( ${#zips[@]} != 1 )); then
            echo "expected exactly one dist/*.zip, found ${#zips[@]}" >&2
            exit 1
          fi
          TAG="${GITHUB_REF_NAME}"
          ZIP=$(echo dist/*.zip)
          if [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            PRE=()
          else
            PRE=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" \
              --title "$TAG" \
              --generate-notes \
              "${PRE[@]}"
          fi
