name: Continuous Integration

on:
  pull_request:
    branches: ['**']
  push:
    branches: ['**']
    tags: [v*]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SBT_OPTS: '-Xmx12G'

jobs:
  build:
    name: Build and Test
    strategy:
      matrix:
        os: [ubuntu-latest]
        scala: [3.8.4]
        java: [temurin@25]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java (temurin@25)
        if: matrix.java == 'temurin@25'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Check that workflows are up to date
        run: sbt '++ ${{ matrix.scala }}; githubWorkflowCheck'

      - name: Build project
        run: sbt '++ ${{ matrix.scala }}; test'

      - name: Compress target directories
        run: tar cf targets.tar target/out/jvm/scala-3.8.4/atbp-plate target/out/jvm/scala-3.8.4/atbp-liga target/out/jvm/scala-3.8.4/atbp-root target/out/jvm/scala-3.8.4/atbp-liga-common target/out/jvm/scala-3.8.4/atbp-traceviz target/out/jvm/scala-3.8.4/atbp-confluence target/out/jvm/scala-3.8.4/atbp-md2c target/out/jvm/scala-3.8.4/atbp-http target/out/jvm/scala-3.8.4/atbp-adf-builder target/out/jvm/scala-3.8.4/atbp-stmt2csv target/out/sjs1/scala-3.8.4/atbp-liga-js target/out/jvm/scala-3.8.4/atbp-jira target/out/jvm/scala-3.8.4/atbp-hubad target/out/jvm/scala-3.8.4/atbp-retext target/out/sjs1/scala-3.8.4/atbp-liga-common target/out/jvm/scala-3.8.4/atbp-cli target/out/jvm/scala-3.8.4/atbp-stmt2csv-it project/target

      - name: Upload target directories
        uses: actions/upload-artifact@v7
        with:
          name: target-${{ matrix.os }}-${{ matrix.scala }}-${{ matrix.java }}
          path: targets.tar

  publish:
    name: Publish Artifacts
    needs: [build]
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    strategy:
      matrix:
        os: [ubuntu-latest]
        scala: [3.8.4]
        java: [temurin@25]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java (temurin@25)
        if: matrix.java == 'temurin@25'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Download target directories (3.8.4)
        uses: actions/download-artifact@v8
        with:
          name: target-${{ matrix.os }}-3.8.4-${{ matrix.java }}

      - name: Inflate target directories (3.8.4)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Log in to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Publish jars
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        run: sbt ci-release

      - name: Publish container
        run: sbt dockerPublish
